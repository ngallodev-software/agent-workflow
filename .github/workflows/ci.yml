name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            suite: full
          - os: ubuntu-latest
            python-version: "3.12"
            suite: full
          - os: ubuntu-latest
            python-version: "3.13"
            suite: full
          - os: macos-latest
            python-version: "3.12"
            suite: full
          - os: windows-latest
            python-version: "3.12"
            suite: release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Normalize Windows checkout
        if: runner.os == 'Windows'
        shell: bash
        run: git config core.autocrlf false && git reset --hard
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux system tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Install macOS system tools
        if: runner.os == 'macOS'
        run: brew install zstd
      - name: Install test dependencies
        shell: bash
        run: python -m pip install 'setuptools>=61' 'pytest>=8,<10' 'jsonschema>=4.18,<5' 'PyYAML>=6.0.3,<7' 'mcp==1.28.1' 'build>=1.2,<2' 'agent-workflow-comparative-eval @ git+https://github.com/ngallodev-software/agent-workflow-comparative-eval.git@master'
      - name: Verify default legacy dependency is absent
        shell: bash
        run: python -c "import importlib.util; assert importlib.util.find_spec('specgen_contracts') is None"
      - name: Acceptance and invariant suite
        if: matrix.suite == 'full'
        shell: bash
        run: |
            python scripts/bump-version.py --check
            ./scripts/release-check.sh
      - name: Legacy native-job/v1 compatibility
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check '.[legacy-specgen]'
          python - <<'PY'
          from importlib import metadata
          from agent_workflow.shared_contracts import negotiate_bundle
          from specgen_contracts.bundle import BUNDLE_VERSION, schema_digest

          assert metadata.version("specgen-agent-workflow-contracts") == "0.2.1"
          schema_id = "agent-workflow/prompt-pack/v2"
          assert negotiate_bundle({
              "bundle_version": BUNDLE_VERSION,
              "schema_id": schema_id,
              "schema_digest": schema_digest(schema_id),
          })["schema_id"] == schema_id
          PY
      - name: Cross-platform release build validation
        shell: bash
        run: ./scripts/ci-release-build.sh
      - name: Install built wheel on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist/agent_workflow-*.whl | Select-Object -First 1 -ExpandProperty FullName
          ./install.ps1 -Python python -Wheel $wheel
          python -c "from importlib.metadata import version; assert version('agent-workflow') == open('VERSION').read().strip()"
      - name: Compile and release assets
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n install.sh uninstall.sh scripts/*.sh
