name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            suite: full
          - os: ubuntu-latest
            python-version: "3.12"
            suite: full
          - os: ubuntu-latest
            python-version: "3.13"
            suite: full
          - os: macos-latest
            python-version: "3.12"
            suite: full
          - os: windows-latest
            python-version: "3.12"
            suite: release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux system tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux zstd
      - name: Install macOS system tools
        if: runner.os == 'macOS'
        run: brew install tmux zstd
      - name: Install test dependencies
        shell: bash
        run: python -m pip install 'setuptools>=61' 'pytest>=8,<10' 'jsonschema>=4.18,<5' 'PyYAML>=6.0.3,<7' 'mcp==1.28.1' 'build>=1.2,<2'
      - name: Acceptance and invariant suite
        if: matrix.suite == 'full'
        shell: bash
        run: python -m pytest
      - name: Cross-platform release build validation
        shell: bash
        run: |
          python -m compileall -q src
          python -m build --sdist --wheel --outdir dist
          wheel=$(python -c 'from pathlib import Path; print(next(Path("dist").glob("agent_workflow-*.whl")))')
          sdist=$(python -c 'from pathlib import Path; print(next(Path("dist").glob("agent_workflow-*.tar.gz")))')
          python scripts/build-release-bundles.py \
            --version "v$(python -c 'print(__import__("pathlib").Path("VERSION").read_text().strip())')" \
            --wheel "$wheel" --sdist "$sdist" --output-dir dist
          python scripts/write-release-checksums.py --output-dir dist
          python scripts/audit-release-assets.py
      - name: Compile and release assets
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n install.sh uninstall.sh scripts/*.sh
