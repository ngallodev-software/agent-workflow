name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            suite: full
          - os: ubuntu-latest
            python-version: "3.12"
            suite: full
          - os: ubuntu-latest
            python-version: "3.13"
            suite: full
          - os: macos-latest
            python-version: "3.12"
            suite: full
          - os: windows-latest
            python-version: "3.12"
            suite: release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Normalize Windows checkout
        if: runner.os == 'Windows'
        shell: bash
        run: git config core.autocrlf false && git reset --hard
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux system tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Install macOS system tools
        if: runner.os == 'macOS'
        run: brew install zstd
      - name: Install test dependencies
        shell: bash
        run: python -m pip install 'setuptools>=61' 'pytest>=8,<10' 'jsonschema>=4.18,<5' 'PyYAML>=6.0.3,<7' 'mcp==1.28.1' 'build>=1.2,<2' 'specgen-agent-workflow-contracts @ git+https://github.com/ngallodev-software/agent-workflow-spec-contracts.git'
      - name: Acceptance and invariant suite
        if: matrix.suite == 'full'
        shell: bash
        run: |
            python scripts/bump-version.py --check
            ./scripts/release-check.sh
      - name: Cross-platform release build validation
        shell: bash
        run: ./scripts/ci-release-build.sh
      - name: Install built wheel on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist/agent_workflow-*.whl | Select-Object -First 1 -ExpandProperty FullName
          ./install.ps1 -Python python -Wheel $wheel
          python -c "from importlib.metadata import version; assert version('agent-workflow') == open('VERSION').read().strip()"
      - name: Compile and release assets
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n install.sh uninstall.sh scripts/*.sh
