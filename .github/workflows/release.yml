name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version tag to validate (publishing is disabled for manual runs)"
        required: true
        default: "v0.8.0"
        type: string

permissions:
  contents: write

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            suite: full
          - name: macos
            os: macos-latest
            suite: full
          - name: windows
            os: windows-latest
            suite: release
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linux system tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Install macOS system tools
        if: runner.os == 'macOS'
        run: brew install zstd
      - name: Install validation dependencies
        shell: bash
        run: python -m pip install 'setuptools>=61' 'pytest>=8,<10' 'jsonschema>=4.18,<5' 'PyYAML>=6.0.3,<7' 'mcp==1.28.1' 'build>=1.2,<2'
      - name: Verify tag matches package version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          tag = os.environ["RELEASE_TAG"]
          match = re.search(r'^version = "([^"]+)"$', pathlib.Path("pyproject.toml").read_text(), re.MULTILINE)
          if not match or tag.removeprefix("v") != match.group(1):
              raise SystemExit(f"tag {tag!r} does not match pyproject version {match.group(1) if match else None!r}")
          PY
      - name: Acceptance and invariant suite
        if: matrix.suite == 'full'
        shell: bash
        run: |
            python -m pytest
      - name: Build wheel and source distribution
        shell: bash
        run: |
          python -m build --sdist --wheel --outdir dist
      - name: Build release installer bundles
        shell: bash
        run: |
          wheel=$(python -c 'from pathlib import Path; print(next(Path("dist").glob("agent_workflow-*.whl")))')
          sdist=$(python -c 'from pathlib import Path; print(next(Path("dist").glob("agent_workflow-*.tar.gz")))')
          python scripts/build-release-bundles.py \
            --version "$RELEASE_TAG" \
            --wheel "$wheel" \
            --sdist "$sdist" \
            --output-dir dist
      - name: Write checksum manifest
        shell: bash
        run: |
          find dist -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) -print0 \
            | sort -z | xargs -0 sha256sum > dist/SHA256SUMS
      - name: Audit release assets
        shell: bash
        run: python scripts/audit-release-assets.py
      - name: Upload platform validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-${{ matrix.name }}
          path: dist/*

  release:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build publishable release assets
        shell: bash
        run: |
          python -m pip install 'setuptools>=61' 'build>=1.2,<2'
          python -m build --sdist --wheel --outdir dist
          wheel=$(python -c 'from pathlib import Path; print(next(Path("dist").glob("agent_workflow-*.whl")))')
          sdist=$(python -c 'from pathlib import Path; print(next(Path("dist").glob("agent_workflow-*.tar.gz")))')
          python scripts/build-release-bundles.py \
            --version "$RELEASE_TAG" --wheel "$wheel" --sdist "$sdist" --output-dir dist
          find dist -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) -print0 \
            | sort -z | xargs -0 sha256sum > dist/SHA256SUMS
          python scripts/audit-release-assets.py
      - name: Publish tagged release
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes dist/*
