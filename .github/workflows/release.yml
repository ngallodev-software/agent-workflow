name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version tag to validate (manual runs never publish)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            suite: full
          - name: macos
            os: macos-latest
            suite: full
          - name: windows
            os: windows-latest
            suite: release
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linux system tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Install macOS system tools
        if: runner.os == 'macOS'
        run: brew install zstd
      - name: Install validation dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'setuptools>=61' 'pytest>=8,<10' 'jsonschema>=4.18,<5' \
            'PyYAML>=6.0.3,<7' 'mcp==1.28.1' 'build>=1.2,<2' \
            'specgen-agent-workflow-contracts @ git+https://github.com/ngallodev-software/agent-workflow-spec-contracts.git' \
            'agent-workflow-comparative-eval @ git+https://github.com/ngallodev-software/agent-workflow-comparative-eval.git@master'
      - name: Verify tag matches package version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          tag = os.environ["RELEASE_TAG"]
          match = re.search(
              r'^version = "([^"]+)"$',
              pathlib.Path("pyproject.toml").read_text(),
              re.MULTILINE,
          )
          version = match.group(1) if match else None
          if tag != f"v{version}":
              raise SystemExit(
                  f"tag {tag!r} does not exactly match package version {version!r}"
              )
          PY
      - name: Full technical release gate
        if: matrix.suite == 'full'
        shell: bash
        run: ./scripts/release-check.sh
      - name: Cross-platform release build validation
        shell: bash
        run: ./scripts/ci-release-build.sh
      - name: Upload platform validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-${{ matrix.name }}
          path: dist/*

  release:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install release dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          python -m pip install --upgrade pip
          python -m pip install \
            'setuptools>=61' 'pytest>=8,<10' 'jsonschema>=4.18,<5' \
            'PyYAML>=6.0.3,<7' 'mcp==1.28.1' 'build>=1.2,<2' \
            'specgen-agent-workflow-contracts @ git+https://github.com/ngallodev-software/agent-workflow-spec-contracts.git' \
            'agent-workflow-comparative-eval @ git+https://github.com/ngallodev-software/agent-workflow-comparative-eval.git@master'
      - name: Build canonical release assets
        shell: bash
        run: ./scripts/ci-release-build.sh
      - name: Generate canonical release evidence
        shell: bash
        run: |
          artifacts="$(
            find dist -maxdepth 1 -type f -print | sort | paste -sd: -
          )"
          AGENT_WORKFLOW_RELEASE_ARTIFACTS="$artifacts" ./scripts/release-check.sh
      - name: Classify publication tier
        id: publication
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          evidence = json.loads(
              Path("build/release-evidence/release-evidence.json").read_text(
                  encoding="utf-8"
              )
          )
          status = evidence["status"]
          if status == "technical_failure":
              raise SystemExit("technical release failure is never publishable")
          if status == "ready":
              print("prerelease=false")
              print("title_suffix=")
              raise SystemExit(0)
          if status != "blocked":
              raise SystemExit(f"unsupported release evidence status: {status!r}")

          allowed_preview_blockers = {"REL-003"}
          blockers = {
              check.get("backlog_id")
              for check in evidence.get("checks", [])
              if check.get("status") in {"blocked", "not_run"}
          }
          if not blockers or not blockers <= allowed_preview_blockers:
              raise SystemExit(
                  "preview publication refused; unexpected blockers: "
                  + ", ".join(sorted(str(item) for item in blockers))
              )
          print("prerelease=true")
          print("title_suffix= (preview)")
          PY
      - name: Verify public bootstrap assets
        shell: bash
        run: |
          test -f install.sh
          test -f install.ps1
          test -f dist/SHA256SUMS
          test -f build/release-evidence/release-evidence.json
          test -f build/release-evidence/sbom.cdx.json
          test -f build/release-evidence/build-provenance.json
      - name: Publish tagged GitHub release
        env:
          PRERELEASE: ${{ steps.publication.outputs.prerelease }}
          TITLE_SUFFIX: ${{ steps.publication.outputs.title_suffix }}
        shell: bash
        run: |
          args=(
            release create "$RELEASE_TAG"
            --verify-tag
            --generate-notes
            --title "Agent-Workflow $RELEASE_TAG$TITLE_SUFFIX"
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}" \
            dist/* \
            build/release-evidence/* \
            install.sh \
            install.ps1
