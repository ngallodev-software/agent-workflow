name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          tag = os.environ["RELEASE_TAG"]
          match = re.search(r'^version = "([^"]+)"$', pathlib.Path("pyproject.toml").read_text(), re.MULTILINE)
          if not match or tag.removeprefix("v") != match.group(1):
              raise SystemExit(f"tag {tag!r} does not match pyproject version {match.group(1) if match else None!r}")
          PY
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade "build>=1.2,<2"
          python -m build --sdist --wheel --outdir dist
      - name: Build release installer bundles
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          wheel=$(find dist -maxdepth 1 -name 'agent_workflow-*.whl' -print -quit)
          sdist=$(find dist -maxdepth 1 -name 'agent_workflow-*.tar.gz' -print -quit)
          python scripts/build-release-bundles.py \
            --version "$RELEASE_TAG" \
            --wheel "$wheel" \
            --sdist "$sdist" \
            --output-dir dist
      - name: Write checksum manifest
        run: |
          find dist -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum > dist/SHA256SUMS
      - name: Publish tagged release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes dist/*
