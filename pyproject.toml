[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workflow"
version = "0.7.6"
description = "Terminal-first, observable workflow for bounded coding-agent delegation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.18,<5",
  "mcp==1.28.1",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "build>=1.2,<2",
  "setuptools>=61",
]
eval = [
  "inspect-ai==0.3.247",
  "inspect-swe==0.2.66",
]
stats = ["scipy>=1.11,<2"]
otel = [
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]
mlflow = ["mlflow>=3,<4"]
completion = ["shtab>=1.7,<2"]
benchmark-visual = ["playwright==1.57.0"]
# Kept as a compatibility alias for callers that explicitly request [mcp].
mcp = ["mcp==1.28.1"]

[project.scripts]
agent-workflow = "agent_workflow.cli:main"
agent-workflow-mcp = "agent_workflow.mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_workflow = ["assets/**/*"]

[tool.setuptools.data-files]
"share/agent-workflow/schemas" = ["schemas/*.json"]
"share/agent-workflow/release" = ["release/*.json"]
"share/agent-workflow/templates/evaluation" = ["templates/evaluation/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "live: opt-in compatibility checks requiring real tmux or paid agent executors",
  "future: strict expected-failure acceptance specifications for approved backlog behavior",
]
