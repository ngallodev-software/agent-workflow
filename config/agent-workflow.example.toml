schema_version = 1

[paths]
worktree_root = "~/.local/share/agent-workflow/worktrees"
state_root = "~/.local/state/agent-workflow"

[supervisor]
# The supervisor is foreground-only; no background daemon is installed.
interval_seconds = 10
probe_stalled = true
interrupt_stalled = false
restart_orphaned = false
max_remediation_attempts = 1
sync_index = true

[git]
branch_prefix = "impl/"
require_clean_source = true
repository_allowlist = []

[security]
mode = "local"
executable_digest = true
policy_files = []

[pack]
archive_level = 19
write_sha256 = true
validate_before_archive = true

[plugins]
enabled = []

[agents]
preferred_names = ["larry", "moe", "curly"]
generated_prefix = "agent"
# Legacy/operator defaults. Normal orchestration selects a logical role below.
default_executor = "codex"
default_class = "implementation"

[roles]
default = "implementation"

[roles.bindings]
implementation = "code-primary"
review = "review-primary"
exploration = "exploration-primary"

[runtime_aliases.code-primary]
executor = "codex"
model = "gpt-5.6-luna"
reasoning_effort = "medium"

[runtime_aliases.review-primary]
executor = "codex"
model = "gpt-5.6-luna"
reasoning_effort = "medium"

[runtime_aliases.exploration-primary]
executor = "claude"
model = "haiku"

# Legacy named profiles are intentionally omitted. They remain readable only
# as an operator migration surface and no longer select a runtime implicitly.

[agent_classes.exploratory]
interactive = false
default_executor = "claude"
default_model = "haiku"

[agent_classes.exploratory.models]
claude = ["haiku"]
codex = ["gpt-5.6-luna"]

[agent_classes.review]
interactive = false
default_executor = "codex"
default_model = "gpt-5.6-luna"

[agent_classes.review.models]
claude = ["haiku", "sonnet"]
codex = ["gpt-5.6-luna"]

[agent_classes.implementation]
interactive = false
default_executor = "codex"
default_model = "gpt-5.6-luna"

[agent_classes.implementation.models]
claude = ["haiku", "sonnet"]
codex = ["gpt-5.6-luna"]

[executors.codex]
command = ["codex", "exec", "--sandbox", "workspace-write", "--skip-git-repo-check", "-"]
interactive_command = ["codex"]
models = ["gpt-5.6-luna"]
default_model = "gpt-5.6-luna"
reasoning_effort = "medium"
model_arg = ["--model"]
interactive_permission_args = ["--ask-for-approval", "on-request"]
non_interactive_permission_args = []

[executors.claude]
command = ["claude", "--print"]
interactive_command = ["claude"]
models = ["haiku", "sonnet", "opus", "fable"]
default_model = "sonnet"
no_go_models = ["opus", "fable"]
model_arg = ["--model"]
interactive_permission_args = ["--permission-mode", "manual"]
non_interactive_permission_args = ["--permission-mode", "manual"]
