<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Rebuildable SQLite evidence projection</title><desc id="d">Authoritative JSON and JSONL evidence is reconciled into a searchable SQLite projection for operations and analysis</desc>
<rect width="1200" height="520" rx="24" fill="#ffffff"/>
<g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<text x="52" y="58" fill="#10213a" font-size="28" font-weight="750">Durable truth, fast search</text>
<text x="52" y="90" fill="#5b6d82" font-size="16">JSON/JSONL and sealed receipts remain authoritative; SQLite is disposable and rebuildable.</text>
<g>
<rect x="54" y="132" width="300" height="270" rx="20" fill="#f4f7fb" stroke="#7657d6" stroke-width="2"/>
<text x="204" y="168" text-anchor="middle" fill="#10213a" font-size="18" font-weight="700">Authoritative evidence</text>
<g fill="#5b6d82" font-size="14">
<text x="84" y="210">◆ launch and source contracts</text>
<text x="84" y="246">◆ append-only JSONL journals</text>
<text x="84" y="282">◆ workflow snapshots and events</text>
<text x="84" y="318">◆ sealed completion and receipts</text>
<text x="84" y="354">◆ portable per-run archives</text>
</g>
<rect x="438" y="176" width="324" height="182" rx="20" fill="#f4f7fb" stroke="#00a7c7" stroke-width="2"/>
<text x="600" y="214" text-anchor="middle" fill="#10213a" font-size="18" font-weight="700">Deterministic reconciler</text>
<g fill="#5b6d82" font-size="14" text-anchor="middle">
<text x="600" y="250">no-follow reads · shared journal locks</text>
<text x="600" y="280">schema validation · source digests</text>
<text x="600" y="310">one writer · transactional per-run replace</text>
<text x="600" y="340">corrupt-run quarantine · full rebuild</text>
</g>
<rect x="846" y="132" width="300" height="270" rx="20" fill="#f4f7fb" stroke="#7657d6" stroke-width="2"/>
<text x="996" y="168" text-anchor="middle" fill="#10213a" font-size="18" font-weight="700">SQLite projection</text>
<g fill="#5b6d82" font-size="14">
<text x="876" y="210">◆ run and workflow views</text>
<text x="876" y="246">◆ incidents and permissions</text>
<text x="876" y="282">◆ health and process metrics</text>
<text x="876" y="318">◆ performance summaries</text>
<text x="876" y="354">◆ CLI and supervisor queries</text>
</g>
<path d="M354 267 H438" stroke="#5b6d82" stroke-width="2.5"/><path d="M420 257 l18 10 -18 10" fill="#5b6d82"/>
<path d="M762 267 H846" stroke="#5b6d82" stroke-width="2.5"/><path d="M828 257 l18 10 -18 10" fill="#5b6d82"/>
</g>
<rect x="210" y="438" width="780" height="44" rx="14" fill="#f4f7fb" stroke="#00a7c7"/>
<text x="600" y="466" text-anchor="middle" fill="#10213a" font-size="14" font-weight="650">Delete the database at any time → index rebuild → verify --full → same authority, restored query surface</text>
</g></svg>
