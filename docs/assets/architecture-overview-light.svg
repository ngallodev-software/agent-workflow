<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">agent-workflow architecture</title><desc id="d">Root orchestrator coordinates team leads and worker panes through durable evidence</desc>
<rect width="1200" height="560" rx="24" fill="#ffffff"/>
<g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
<text x="52" y="62" fill="#10213a" font-size="28" font-weight="750">Hierarchical orchestration, durable authority</text>
<text x="52" y="94" fill="#5b6d82" font-size="16">tmux presents the work; append-only records and sealed receipts decide what happened.</text>
<g font-size="16" font-weight="650" text-anchor="middle">
<rect x="430" y="126" width="340" height="62" rx="16" fill="#f4f7fb" stroke="#7657d6" stroke-width="2"/><text x="600" y="153" fill="#10213a">Root orchestrator</text><text x="600" y="176" fill="#5b6d82" font-size="13">cross-team scheduling · budgets · acceptance</text>
<path d="M600 188 V224 M600 224 H280 V254 M600 224 H920 V254" stroke="#5b6d82" stroke-width="2" fill="none"/>
<rect x="110" y="254" width="340" height="62" rx="16" fill="#f4f7fb" stroke="#00a7c7" stroke-width="2"/><text x="280" y="281" fill="#10213a">Team lead · tmux window A</text><text x="280" y="304" fill="#5b6d82" font-size="13">local plan · worker coordination · escalation</text>
<rect x="750" y="254" width="340" height="62" rx="16" fill="#f4f7fb" stroke="#00a7c7" stroke-width="2"/><text x="920" y="281" fill="#10213a">Team lead · tmux window B</text><text x="920" y="304" fill="#5b6d82" font-size="13">local plan · worker coordination · escalation</text>
<path d="M280 316 V354 M280 354 H170 V380 M280 354 H390 V380 M920 316 V354 M920 354 H810 V380 M920 354 H1030 V380" stroke="#5b6d82" stroke-width="2" fill="none"/>
<rect x="90" y="380" width="160" height="50" rx="13" fill="#f4f7fb" stroke="#00a7c7"/><text x="170" y="410" fill="#10213a">worker pane</text><rect x="310" y="380" width="160" height="50" rx="13" fill="#f4f7fb" stroke="#00a7c7"/><text x="390" y="410" fill="#10213a">worker pane</text><rect x="730" y="380" width="160" height="50" rx="13" fill="#f4f7fb" stroke="#00a7c7"/><text x="810" y="410" fill="#10213a">worker pane</text><rect x="950" y="380" width="160" height="50" rx="13" fill="#f4f7fb" stroke="#00a7c7"/><text x="1030" y="410" fill="#10213a">worker pane</text>
</g>
<g transform="translate(180 470)"><rect width="840" height="50" rx="15" fill="#f4f7fb" stroke="#7657d6" stroke-width="1.5"/><text x="420" y="30" text-anchor="middle" fill="#10213a" font-size="15" font-weight="650">Durable plane: contracts · journals · acknowledgements · incidents · remediation · receipts</text></g>
</g></svg>