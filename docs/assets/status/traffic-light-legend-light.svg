<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="250" viewBox="0 0 1320 250">
<rect width="1320" height="250" rx="22" fill="#FFFFFF"/>
<text x="38" y="55" font-family="DejaVu Sans, Arial" font-size="32" font-weight="700" fill="#111827">Agent Workflow — Operator Attention</text>
<circle cx="79" cy="131" r="38" fill="#16A34A" stroke="#0F172A" stroke-width="4"/>
<text x="79" y="148" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="42" font-weight="700" fill="#fff">✓</text>
<text x="136" y="116" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#111827">Healthy</text>
<text x="136" y="150" font-family="DejaVu Sans, Arial" font-size="18" fill="#111827">No operator action needed</text>
<circle cx="399" cy="131" r="38" fill="#D97706" stroke="#0F172A" stroke-width="4"/>
<text x="399" y="148" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="42" font-weight="700" fill="#fff">!</text>
<text x="456" y="116" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#111827">Attention</text>
<text x="456" y="150" font-family="DejaVu Sans, Arial" font-size="18" fill="#111827">Review or monitor soon</text>
<circle cx="719" cy="131" r="38" fill="#DC2626" stroke="#0F172A" stroke-width="4"/>
<text x="719" y="148" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="42" font-weight="700" fill="#fff">×</text>
<text x="776" y="116" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#111827">Action required</text>
<text x="776" y="150" font-family="DejaVu Sans, Arial" font-size="18" fill="#111827">Intervention required now</text>
<circle cx="1039" cy="131" r="38" fill="#64748B" stroke="#0F172A" stroke-width="4"/>
<text x="1039" y="148" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="42" font-weight="700" fill="#fff">–</text>
<text x="1096" y="116" font-family="DejaVu Sans, Arial" font-size="23" font-weight="700" fill="#111827">No live signal</text>
<text x="1096" y="150" font-family="DejaVu Sans, Arial" font-size="18" fill="#111827">Queued, archived, or unknown</text>
</svg>