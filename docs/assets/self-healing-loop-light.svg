<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="t d"><title id="t">Bounded self-healing loop</title><desc id="d">Observe, diagnose, authorize, act, verify, and record</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6d82"/></marker></defs><rect width="1200" height="410" rx="24" fill="#ffffff"/><g font-family="Inter, ui-sans-serif, system-ui, sans-serif"><text x="52" y="62" fill="#10213a" font-size="28" font-weight="750">Bounded deterministic self-healing</text><text x="52" y="94" fill="#5b6d82" font-size="16">Automatic actions may narrow or restore known state; they never expand authority or accept work.</text><g transform="translate(50 0)"><rect x="0" y="190" width="150" height="92" rx="16" fill="#f4f7fb" stroke="#00a7c7"/><text x="75" y="226" text-anchor="middle" fill="#10213a" font-size="17" font-weight="700">Observe</text><text x="75" y="252" text-anchor="middle" fill="#5b6d82" font-size="12">health · terminal · messages</text><rect x="190" y="190" width="150" height="92" rx="16" fill="#f4f7fb" stroke="#7657d6"/><text x="265" y="226" text-anchor="middle" fill="#10213a" font-size="17" font-weight="700">Diagnose</text><text x="265" y="252" text-anchor="middle" fill="#5b6d82" font-size="12">typed incident taxonomy</text><rect x="380" y="190" width="150" height="92" rx="16" fill="#f4f7fb" stroke="#7657d6"/><text x="455" y="226" text-anchor="middle" fill="#10213a" font-size="17" font-weight="700">Authorize</text><text x="455" y="252" text-anchor="middle" fill="#5b6d82" font-size="12">rule · budget · capability</text><rect x="570" y="190" width="150" height="92" rx="16" fill="#f4f7fb" stroke="#7657d6"/><text x="645" y="226" text-anchor="middle" fill="#10213a" font-size="17" font-weight="700">Act</text><text x="645" y="252" text-anchor="middle" fill="#5b6d82" font-size="12">idempotent bounded repair</text><rect x="760" y="190" width="150" height="92" rx="16" fill="#f4f7fb" stroke="#00a7c7"/><text x="835" y="226" text-anchor="middle" fill="#10213a" font-size="17" font-weight="700">Verify</text><text x="835" y="252" text-anchor="middle" fill="#5b6d82" font-size="12">authoritative result</text><rect x="950" y="190" width="150" height="92" rx="16" fill="#f4f7fb" stroke="#7657d6"/><text x="1025" y="226" text-anchor="middle" fill="#10213a" font-size="17" font-weight="700">Record</text><text x="1025" y="252" text-anchor="middle" fill="#5b6d82" font-size="12">incident + remediation journal</text><path d="M150 236 H180" stroke="#5b6d82" stroke-width="2" marker-end="url(#a)"/><path d="M340 236 H370" stroke="#5b6d82" stroke-width="2" marker-end="url(#a)"/><path d="M530 236 H560" stroke="#5b6d82" stroke-width="2" marker-end="url(#a)"/><path d="M720 236 H750" stroke="#5b6d82" stroke-width="2" marker-end="url(#a)"/><path d="M910 236 H940" stroke="#5b6d82" stroke-width="2" marker-end="url(#a)"/><path d="M1095 282 V340 H70 V282" fill="none" stroke="#5b6d82" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/><text x="550" y="372" text-anchor="middle" fill="#5b6d82" font-size="14">repeat until healthy, circuit-broken, or escalated to a human principal</text></g></g></svg>