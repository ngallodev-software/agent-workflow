# Agent Workflow traffic-light presentation
# Source this file explicitly; do not mutate the user's tmux configuration
# automatically.

set -g status-interval 5
set -g status-right-length 80
set -g status-right '#(~/.local/lib/agent-workflow/tmux-status-line.sh)'

# Suggested opt-in key bindings for the future native commands:
